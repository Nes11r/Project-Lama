services:
  api:
    build: .
    image: gas-forecast:latest
    command: sh scripts/start_api.sh
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./dataset:/app/dataset          # xam ROC CSV-lər (+ incoming/)
      - ./storage:/app/storage          # emal olunmuş data, keş, modellər, runtime
      - ./config:/app/config            # calendar_overrides.yaml, events.yaml
      - ./config.yaml:/app/config.yaml
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40m                 # ilk işə salmada model öyrədilir
    restart: unless-stopped

  frontend:
    image: gas-forecast:latest
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
